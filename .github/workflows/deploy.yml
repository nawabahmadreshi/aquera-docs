name: Build and Deploy (Integrated Theme + Content)

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!toc'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Content Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Install Dependencies
        run: |
          gem install bundler
          bundle install

      - name: Merge Theme from TOC branch
        run: |
          set -e
          echo "🎨 Pulling Theme and Assets from 'toc' branch..."
          git checkout origin/toc -- _scss css fonts js images _layouts _includes
          
      - name: Build Integrated Site
        run: |
          set -e
          echo "docsBranch: '${GITHUB_REF_NAME}'" >> _config.yml
          echo "docsVersion: '${GITHUB_REF_NAME}'" >> _config.yml
          bundle exec jekyll build
          mv _site ../output

      - name: Deploy to Main Branch
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Move build to a safe place
          mv ../output /tmp/docs_build
          
          # CLEAR WORKSPACE to allow checkout
          git reset --hard HEAD
          git clean -fd
          
          # Switch to main branch
          git checkout main
          
          echo "📂 Deploying Versioned Content to /${GITHUB_REF_NAME}/..."
          rm -rf "${GITHUB_REF_NAME}"
          mkdir -p "${GITHUB_REF_NAME}"
          cp -r /tmp/docs_build/* "${GITHUB_REF_NAME}/"
          
          # Handle draft/latest logic
          if [ "${GITHUB_REF_NAME}" == "draft" ]; then
            rm -rf latest
            mkdir -p latest
            cp -r /tmp/docs_build/* latest/
          fi
          
          git add .
          git commit -m "Deploy integrated styled build for ${GITHUB_REF_NAME} [skip ci]" || echo "No changes to commit"
          git push origin main
